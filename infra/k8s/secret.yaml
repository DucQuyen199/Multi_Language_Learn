apiVersion: v1
kind: Secret
metadata:
  name: lingua-atlas-secrets
  namespace: lingua-atlas
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root
  MYSQL_PASSWORD: app
  DATABASE_URL: "app:app@tcp(mysql:3306)/multilanguage?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci"
  DEMO_USER_ID: 00000000-0000-0000-0000-000000000001
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lingua-atlas
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lingua-atlas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/lingua-atlas-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: lingua-atlas-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lingua-atlas-secrets
                  key: DATABASE_URL
            - name: DEMO_USER_ID
              valueFrom:
                secretKeyRef:
                  name: lingua-atlas-secrets
                  key: DEMO_USER_ID
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: lingua-atlas-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lingua-atlas-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
